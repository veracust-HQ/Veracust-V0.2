name: Docker build and smoke test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "server.py"
      - "voice_guard.py"
      - "enterprise_billing.py"
      - ".github/workflows/docker-build-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "server.py"
      - "voice_guard.py"
      - "enterprise_billing.py"
      - ".github/workflows/docker-build-smoke-test.yml"

permissions:
  contents: read

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build customer image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: veracust-api:ci
          load: true
          push: false

      - name: Generate safe synthetic audio fixture
        run: |
          mkdir -p /tmp/veracust-fixtures
          python - <<'PY'
          import math
          import random
          import struct
          import wave

          random.seed(42)
          sample_rate = 22050
          duration_seconds = 3
          with wave.open("/tmp/veracust-fixtures/veracust-smoke.wav", "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(sample_rate)
              frames = bytearray()
              for index in range(sample_rate * duration_seconds):
                  t = index / sample_rate
                  envelope = min(1.0, t / 0.12, (duration_seconds - t) / 0.18)
                  fundamental = 145 + 3 * math.sin(2 * math.pi * 3.2 * t)
                  phase = 2 * math.pi * fundamental * t
                  signal = (
                      0.22 * math.sin(phase)
                      + 0.08 * math.sin(2 * phase)
                      + 0.035 * math.sin(3 * phase)
                      + random.uniform(-0.006, 0.006)
                  ) * max(0.0, envelope)
                  value = max(-1.0, min(1.0, signal))
                  frames.extend(struct.pack("<h", int(value * 32767)))
              audio.writeframes(frames)
          PY

      - name: Start container with production-like restrictions
        run: |
          docker run -d --rm \
            --name veracust-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --mount type=bind,src=/tmp/veracust-fixtures,dst=/app/test-audio,readonly \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 8000:8000 \
            veracust-api:ci

      - name: Verify API startup and enterprise routes
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json; then
              break
            fi
            sleep 3
          done
          test -s /tmp/openapi.json
          grep -q '"/v1/private/verify"' /tmp/openapi.json
          grep -q '"/v1/control/authorize"' /tmp/openapi.json
          grep -q '"/v1/control/finalize"' /tmp/openapi.json
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Analyze synthetic audio inside Docker
        run: |
          docker exec veracust-smoke sh -c 'mkdir -p /tmp/numba-cache && NUMBA_CACHE_DIR=/tmp/numba-cache python voice_guard.py /app/test-audio/veracust-smoke.wav' > /tmp/veracust-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/veracust-result.json").read_text())
          assert result.get("verdict") in {
              "AUTHENTIC_HUMAN",
              "SYNTHETIC_DETECTED",
              "INCONCLUSIVE_ESCALATE",
          }, f"Audio engine returned an error: {result}"
          telemetry = result.get("channel_telemetry")
          assert isinstance(telemetry, dict) and telemetry, f"Missing telemetry: {result}"
          required = {
              "detected_profile",
              "nyquist_carrier_energy",
              "ambient_noise_floor",
              "vocal_jitter_index",
              "glottal_entropy",
          }
          assert required.issubset(telemetry), f"Incomplete telemetry: {telemetry}"
          print("Docker audio-analysis smoke test passed:", result["verdict"])
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs veracust-smoke || true

      - name: Stop container
        if: always()
        run: docker stop veracust-smoke || true
